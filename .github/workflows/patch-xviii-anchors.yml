name: Patch XVIII illustration anchors
on:
  push:
    paths:
      - '.github/workflows/patch-xviii-anchors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anchor chapter XVIII illustrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          s=p.read_text()
          s=s.replace("'La mañana siguiente','Lo que dejas encendido','La franja que vuelve'", "'La mañana siguiente','La ración que no se calentó','La franja que vuelve'")
          old="17:[['XVII-I1','La cavidad casi seca',20],['XVII-I2','La película asciende',35]],25:"
          new="17:[['XVII-I1','La cavidad casi seca',20],['XVII-I2','La película asciende',35]],18:[['XVIII-I1','El contacto marcado',11],['XVIII-I2','Elegir qué sigue encendido',55]],25:"
          if old not in s:
              raise SystemExit('expected extraKnown anchor not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          grep -F "XVIII-I1','El contacto marcado',11" book.html
          grep -F "XVIII-I2','Elegir qué sigue encendido',55" book.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book.html
          git commit -m 'feat: anchor chapter XVIII illustrations to narrative beats'
          git push origin HEAD:main
