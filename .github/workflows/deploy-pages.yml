name: Deploy Elyndran Reader + TOP Preview

on:
  push:
    branches: [edit/adventure-pacing-top-pass]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout TOP preview branch
        uses: actions/checkout@v4
        with:
          ref: edit/adventure-pacing-top-pass
          path: preview

      - name: Build stable site and preview
        run: |
          mkdir -p site/preview-top
          rsync -a --exclude='.git' stable/ site/
          rsync -a --exclude='.git' preview/ site/preview-top/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
