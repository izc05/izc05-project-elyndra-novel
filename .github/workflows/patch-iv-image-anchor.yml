name: Patch chapter IV image anchor
on:
  push:
    paths:
      - '.github/workflows/patch-iv-image-anchor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move IV-A after narrative reveal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          s=p.read_text()
          old="const extraKnown={1:[['I-I1','Primer mirador',51]],10:"
          new="const extraKnown={1:[['I-I1','Primer mirador',51]],4:[['IV-A','La estructura de tres brazos',51]],10:"
          if old not in s:
              raise SystemExit('extraKnown marker not found')
          s=s.replace(old,new,1)
          old2="function putOpening(a,i){const h=a.querySelector('h1');if(!h)return;h.after(ill(roman[i]+'-A',openingLabels[i],true))}"
          new2="function putOpening(a,i){const h=a.querySelector('h1');if(!h||i===4)return;h.after(ill(roman[i]+'-A',openingLabels[i],true))}"
          if old2 not in s:
              raise SystemExit('putOpening marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git diff --check
          grep -F "4:[['IV-A','La estructura de tres brazos',51]]" book.html
          grep -F "if(!h||i===4)return" book.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book.html
          git commit -m 'fix: move chapter IV master after structure reveal'
          git push origin HEAD:main
