name: Anchor chapter X illustrations

on:
  push:
    paths:
      - '.github/workflows/fix-reader-image-loading.yml'

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch chapter X anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('book.html')
          s = p.read_text(encoding='utf-8')
          old_label = "'Antes de tocar la raíz','Cara inferior de la plataforma','La órbita vacía'"
          new_label = "'Antes de tocar la raíz','El margen de una hora','La órbita vacía'"
          old_known = "const extraKnown={1:[['I-I1','Primer mirador',11]],25:[['XXV-I2','Región de cascadas y planeadores',18]]};"
          new_known = "const extraKnown={1:[['I-I1','Primer mirador',11]],10:[['X-I1','La primera línea recta',22],['X-I2','La cara inferior parcial',36]],25:[['XXV-I2','Región de cascadas y planeadores',18]]};"
          if old_label not in s:
              raise SystemExit('Expected X opening label not found; refusing unsafe patch')
          if old_known not in s:
              raise SystemExit('Expected anchor map not found; refusing unsafe patch')
          s = s.replace(old_label, new_label, 1).replace(old_known, new_known, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify chapter X contract
        run: |
          grep -F "'El margen de una hora'" book.html
          grep -F "['X-I1','La primera línea recta',22]" book.html
          grep -F "['X-I2','La cara inferior parcial',36]" book.html
          test -f manuscript/10-una-hora-mas.md
      - name: Commit anchors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book.html
          git commit -m 'feat: anchor chapter X illustrations to narrative beats'
          git push origin HEAD:main
