name: Patch chapter I page anchor
on:
  push:
    paths:
      - '.github/workflows/patch-i-page-anchor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move I-I1 to first mirador reveal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          s=p.read_text()
          old="1:[['I-I1','Primer mirador',11]]"
          new="1:[['I-I1','Primer mirador',51]]"
          if old not in s:
              raise SystemExit('chapter I anchor marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -F "I-I1','Primer mirador',51" book.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book.html
          git commit -m 'fix: reanchor chapter I mirador after page recut'
          git push origin HEAD:main
