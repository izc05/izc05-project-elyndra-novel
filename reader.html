<script>
const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){let out=[],para=[];const flush=()=>{if(para.length){let t=esc(para.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');out.push('<p>'+t+'</p>');para=[]}};for(const line of s.split(/\r?\n/)){if(line.startsWith('# ')){flush();out.push('<h1>'+esc(line.slice(2))+'</h1>')}else if(line.trim()==='---'){flush()}else if(!line.trim()){flush()}else para.push(line.trim())}flush();return out.join('\n')}
async function load(){const book=document.getElementById('book'),toc=document.getElementById('toc');book.innerHTML='';for(let i=0;i<files.length;i++){try{const r=await fetch('manuscript/'+files[i]);if(!r.ok)throw new Error(r.status);const text=await r.text(),a=document.createElement('article');a.id=i?'cap-'+roman[i].toLowerCase():'prologo';a.innerHTML=md(text);book.appendChild(a);if(i){const l=document.createElement('a');l.href='#'+a.id;l.textContent=roman[i];toc.appendChild(l)}if(i===12){book.insertAdjacentHTML('beforeend','<section class="map"><h2>Mapa A — Sector local · conocimiento hasta XII</h2><img src="art/maps/MAP_A_LOCAL_MASTER.svg" alt="Mapa A del sector local de Elyndran"></section>')}if(i===25){book.insertAdjacentHTML('beforeend','<section class="map"><h2>Mapa B — Expansión tras XXV</h2><img src="art/maps/MAP_B_XXV_EXPANSION_MASTER.svg" alt="Mapa B de expansión de Elyndran"></section>')}}catch(e){book.insertAdjacentHTML('beforeend','<div class="error">No se pudo cargar '+files[i]+'</div>')}}}load();
</script></body></html>
