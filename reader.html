<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071015">
<title>ELYNDRAN — Novela ilustrada</title>
<style>
:root{--bg:#061015;--panel:#081217;--panel2:#0c171c;--gold:#d0a057;--gold2:#9a6b31;--paper:#f0e9dc;--ink:#211d18;--muted:#8c9699;--line:#283238;--reading:1.08rem;--left:300px;--right:350px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -20%,#10212a 0,#071015 35%,#050b0e 100%);color:#eee;font-family:Georgia,'Times New Roman',serif}.top{position:sticky;top:0;z-index:50;height:66px;display:grid;grid-template-columns:var(--left) 1fr var(--right);align-items:center;background:#061015f5;border-bottom:1px solid #2a3337;backdrop-filter:blur(16px)}.brand{padding:0 20px;letter-spacing:.18em;font-size:1.05rem;color:#f1dfc1}.brand small{display:block;color:var(--gold);font:700 .5rem system-ui;letter-spacing:.34em;margin-top:2px}.tabs{display:flex;justify-content:center;gap:34px}.tabs button{height:66px;border:0;border-bottom:2px solid transparent;background:none;color:#b9b4ac;font:600 .85rem Georgia;cursor:pointer}.tabs button.active{color:#fff0d8;border-bottom-color:var(--gold)}.tools{display:flex;justify-content:flex-end;gap:8px;padding-right:16px}.tools button{border:1px solid #3a4449;background:#0b1418;color:#e9decf;border-radius:7px;min-width:38px;height:36px;cursor:pointer}.progress{position:fixed;top:66px;left:0;height:3px;background:linear-gradient(90deg,#9b6b32,#e1b86e);width:0;z-index:60}.layout{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);min-height:calc(100vh - 66px)}.sidebar,.rightbar{position:sticky;top:69px;height:calc(100vh - 69px);overflow:auto;background:#071116;border-right:1px solid #263036;padding:16px}.rightbar{border-right:0;border-left:1px solid #263036}.resume{border:1px solid #644b2c;border-radius:8px;background:linear-gradient(180deg,#10171a,#0d1215);padding:13px;margin-bottom:18px}.resume b{display:block;color:#f0d5ab;font-size:.92rem}.resume span{display:block;color:#9da5a6;font:500 .72rem/1.4 system-ui;margin:4px 0 10px}.resume .mini{height:5px;background:#1b2428;border-radius:999px;overflow:hidden;margin-bottom:10px}.resume .mini i{display:block;height:100%;background:linear-gradient(90deg,#a87235,#e2b46d)}.resume button{width:100%;padding:9px;border:0;border-radius:6px;background:#9a6b31;color:#fff;font:700 .72rem system-ui;cursor:pointer}.sidebar h3,.rightbar h3{color:var(--gold);font:700 .7rem system-ui;letter-spacing:.11em;text-transform:uppercase;margin:18px 6px 8px}.chapters a{display:block;color:#aeb6b8;text-decoration:none;padding:7px 8px;border-left:3px solid transparent;border-radius:4px;font:500 .74rem/1.28 system-ui}.chapters a.active{color:#fff0d8;background:linear-gradient(90deg,#8c642f,#4e3a22 55%,transparent);border-left-color:#e1b86e}.main{padding:22px 20px 70px}.book{max-width:920px;margin:0 auto}.article{display:none;background:var(--paper);color:var(--ink);padding:clamp(30px,4vw,58px);box-shadow:0 24px 80px #0008;border-radius:6px;min-height:78vh}.article.active{display:block}.chapter-kicker{color:#9b6c2d;font:700 .72rem system-ui;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}.article h1{font-size:clamp(2.4rem,5.2vw,4rem);line-height:1.04;margin:0 0 1.8rem;color:var(--ink);letter-spacing:-.025em}.article p{font-size:var(--reading);line-height:1.82;margin:0 0 1.18rem;color:var(--ink)}.article strong{color:#221a12}.illustration{margin:2rem 0 2.4rem;background:#0a0d0f;border:1px solid #b79c70;border-radius:5px;overflow:hidden;box-shadow:0 14px 35px #0004}.illustration img{display:block;width:100%;max-height:70vh;object-fit:cover;cursor:zoom-in}.illustration figcaption{padding:9px 12px;color:#dfc9a5;background:#101315;font:italic 600 .74rem Georgia;letter-spacing:.03em}.illustration.missing{display:none}.map{margin:2.7rem 0 2.2rem;padding:14px;background:#e1d5c3;border:1px solid #c6b59d}.map h2{margin:0 0 10px;font:700 .78rem system-ui;color:#765123;letter-spacing:.07em;text-transform:uppercase;text-align:center}.map img{display:block;width:100%;max-height:74vh;object-fit:contain;cursor:zoom-in}.map p{font:500 .7rem system-ui;color:#655e55;text-align:center;margin:8px 0 0}.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:2rem;padding-top:1.3rem;border-top:1px solid #c9bdac}.chapter-nav button{border:1px solid #b7a88f;background:#eee4d5;color:#4c3822;padding:12px 14px;border-radius:6px;font:700 .76rem system-ui;cursor:pointer}.chapter-nav button:last-child{text-align:right}.chapter-nav button:disabled{opacity:.4}.rightbar .intro{color:#9ba5a8;font:500 .72rem/1.5 system-ui;margin:0 6px 12px}.atlas-card{margin:0 0 12px;border:1px solid #4d3d27;border-radius:7px;overflow:hidden;background:#0d1519}.atlas-card img{display:block;width:100%;height:160px;object-fit:cover;cursor:zoom-in;background:#d9d1c4}.atlas-card.map-card img{object-fit:contain}.atlas-card figcaption{padding:8px 9px;color:#e5d2b5;font:600 .7rem/1.35 system-ui}.status{margin-top:16px;border:1px solid #4d3d27;border-radius:7px;padding:12px;background:#0c1418}.status h4{margin:0 0 10px;color:var(--gold);font:700 .68rem system-ui;text-transform:uppercase;letter-spacing:.08em}.status-row{display:flex;justify-content:space-between;gap:10px;color:#aeb7b9;font:500 .7rem system-ui;margin:8px 0}.status-track{height:5px;background:#1c2529;border-radius:99px;overflow:hidden}.status-track i{display:block;height:100%;background:#c7914a}.rightbar .quote{margin:22px 10px;color:#c89a58;text-align:center;font:italic .76rem/1.6 Georgia}.lightbox{position:fixed;inset:0;z-index:100;background:#020405ef;display:none;place-items:center;padding:20px}.lightbox.open{display:grid}.lightbox img{max-width:96vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;background:#111;color:#fff;font-size:22px}.theme-black .article{background:#0d1215}.theme-black .article h1,.theme-black .article p,.theme-black .article strong{color:#e6dfd5}.theme-black .article .chapter-kicker{color:#d0a057}.theme-white{background:#f2f2f2}.theme-white .article{background:#fff}.theme-white .sidebar,.theme-white .rightbar,.theme-white .top{background:#fff;color:#111}.theme-white .chapters a{color:#555}.theme-white .chapters a.active{color:#111;background:#eee8de}.theme-white .rightbar .intro,.theme-white .status-row{color:#555}@media(max-width:1180px){:root{--left:250px;--right:0px}.top{grid-template-columns:250px 1fr auto}.rightbar{display:none}.layout{grid-template-columns:250px minmax(0,1fr)}.tools{padding-right:10px}.tabs{gap:22px}}@media(max-width:760px){.top{grid-template-columns:1fr auto;height:58px}.brand{padding-left:13px}.tabs{display:none}.tools button:nth-child(1),.tools button:nth-child(2){display:none}.progress{top:58px}.layout{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid #263036;padding:8px}.resume,.sidebar h3{display:none}.chapters{display:flex;overflow:auto;gap:4px}.chapters a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.chapters a.active{border-left:0;border-bottom-color:var(--gold);background:#3e2d19}.main{padding:16px 0 50px}.book{max-width:none}.article{padding:24px 18px;border-radius:0;box-shadow:none}.article h1{font-size:2.45rem}.illustration{margin:1.7rem -18px 2rem;border-left:0;border-right:0;border-radius:0}.map{margin:2rem -18px;border-left:0;border-right:0}.chapter-nav{grid-template-columns:1fr}.chapter-nav button:last-child{text-align:left}}
</style>
</head>
<body class="theme-paper">
<header class="top"><div class="brand">ELYNDRAN<small>NOVELA</small></div><nav class="tabs"><button class="active">Libro</button><button id="atlasTab">Atlas</button><button id="settingsTab">Ajustes</button></nav><div class="tools"><button id="smaller">A−</button><button id="bigger">A+</button><button id="paper" title="Papel">☼</button><button id="black" title="Negro">◐</button><button id="menuBtn">☰</button></div></header><div class="progress" id="progress"></div>
<div class="layout"><aside class="sidebar"><div class="resume"><b>↻ &nbsp;Continuar lectura</b><span id="resumeText">Prólogo</span><div class="mini"><i id="miniProgress"></i></div><button id="resumeBtn">Continuar</button></div><h3>Capítulos</h3><nav class="chapters" id="chapters"></nav></aside><main class="main"><div class="book" id="book">Cargando manuscrito…</div></main><aside class="rightbar" id="atlas"><h3>Atlas visual</h3><p class="intro">Mapas e ilustraciones de Elyndran disponibles en esta edición.</p><div id="atlasGrid"></div><div class="status"><h4>Progreso de lectura</h4><div class="status-row"><span id="statusChapter">Prólogo</span><strong id="statusPct">0%</strong></div><div class="status-track"><i id="statusBar"></i></div><div class="status-row"><span>Capítulos</span><strong>26</strong></div><div class="status-row"><span>Modo de lectura</span><strong id="themeLabel">Papel</strong></div></div><p class="quote">«Lo desconocido debe seguir siendo más grande que lo comprendido.»</p></aside></div>
<div class="lightbox" id="lightbox"><button>×</button><img alt="Vista ampliada"></div>
<script>
const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['PRÓLOGO','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
const placements={0:[['PROLOGO-A','Descenso hacia Elyndran',4]],1:[['I-A','El primer paso',3],['I-I1','Primer mirador',11]],2:[['II-A','Nivel inferior y discos',7]],4:[['IV-A','La estructura de tres brazos',8]],5:[['V-A','La bóveda nueva',6]],10:[['X-A','Cara inferior de la plataforma',10]],14:[['XIV-A','Bóveda y partículas',7]],15:[['XV-A','Interior de la cápsula y prefiltro',6]],16:[['XVI-A','Exposición dérmica controlada',8]],25:[['XXV-A','Regreso al primer mirador',8],['XXV-I2','Región de cascadas y planeadores',18]]};
const KEY='elyndran-premium-v2';let state={chapter:0,font:1.08,theme:'paper'};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){let out=[],p=[];const flush=()=>{if(p.length){let t=esc(p.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');out.push('<p>'+t+'</p>');p=[]}};for(const l of s.split(/\r?\n/)){if(l.startsWith('# ')){flush();out.push('<h1>'+esc(l.slice(2))+'</h1>')}else if(!l.trim()||l.trim()==='---'){flush()}else p.push(l.trim())}flush();return out.join('')}
function illustration(id,label){const f=document.createElement('figure');f.className='illustration missing';const img=document.createElement('img'),cap=document.createElement('figcaption');img.loading='lazy';img.alt=label+' — ELYNDRAN';cap.textContent=id+' — '+label;f.append(img,cap);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/'+id+'.webp','art/'+id+'.png','art/'+id+'.jpg'];let n=0;img.onload=()=>{f.classList.remove('missing');rebuildAtlas()};img.onerror=()=>{if(++n<paths.length)img.src=paths[n]};img.src=paths[0];return f}
function insertVisuals(article,index){for(const [id,label,after] of placements[index]||[]){const fig=illustration(id,label),paras=article.querySelectorAll('p'),target=paras[Math.min(after,paras.length)-1];target?target.after(fig):article.append(fig)}}
function mapBlock(title,src,note){const s=document.createElement('section');s.className='map';s.innerHTML='<h2>'+title+'</h2><img src="'+src+'" alt="'+title+'"><p>'+note+'</p>';return s}
function titleOf(i){return document.querySelector('.article[data-index="'+i+'"] h1')?.textContent||roman[i]}
function go(i){i=Math.max(0,Math.min(files.length-1,i));state.chapter=i;save();document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));document.querySelectorAll('#chapters a').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));const pct=Math.round((i+1)/files.length*100);document.getElementById('resumeText').textContent=roman[i]+' — '+titleOf(i);document.getElementById('progress').style.width=pct+'%';document.getElementById('miniProgress').style.width=pct+'%';document.getElementById('statusBar').style.width=pct+'%';document.getElementById('statusPct').textContent=pct+'%';document.getElementById('statusChapter').textContent=roman[i]+' — '+titleOf(i);scrollTo({top:66,behavior:'smooth'})}
function nav(i){const d=document.createElement('div');d.className='chapter-nav';const p=document.createElement('button'),n=document.createElement('button');p.textContent=i?'← '+roman[i-1]+' · '+titleOf(i-1):'Inicio';n.textContent=i<files.length-1?roman[i+1]+' · '+titleOf(i+1)+' →':'Fin del libro';p.disabled=!i;n.disabled=i===files.length-1;p.onclick=()=>go(i-1);n.onclick=()=>go(i+1);d.append(p,n);return d}
function zoom(img){document.querySelector('#lightbox img').src=img.src;document.getElementById('lightbox').classList.add('open')}
function rebuildAtlas(){const grid=document.getElementById('atlasGrid');grid.innerHTML='<h3 style="margin-top:4px">Mapas regionales</h3>';[['Mapa A — Sector local','art/maps/MAP_A_LOCAL_MASTER.svg'],['Mapa B — Expansión XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg']].forEach(([label,src])=>{const f=document.createElement('figure');f.className='atlas-card map-card';f.innerHTML='<img src="'+src+'" alt="'+label+'"><figcaption>'+label+'</figcaption>';grid.append(f)});const imgs=[...document.querySelectorAll('.illustration:not(.missing)')];if(imgs.length){grid.insertAdjacentHTML('beforeend','<h3>Ilustraciones del capítulo</h3>');imgs.forEach(f=>{const img=f.querySelector('img'),c=document.createElement('figure');c.className='atlas-card';c.innerHTML='<img src="'+img.src+'" alt="'+img.alt+'"><figcaption>'+f.querySelector('figcaption').textContent+'</figcaption>';grid.append(c)})}grid.querySelectorAll('img').forEach(img=>img.onclick=()=>zoom(img))}
async function load(){const book=document.getElementById('book'),chap=document.getElementById('chapters');book.innerHTML='';for(let i=0;i<files.length;i++){try{const r=await fetch('manuscript/'+files[i]);if(!r.ok)throw new Error(r.status);const text=await r.text(),a=document.createElement('article');a.className='article';a.dataset.index=i;a.innerHTML='<div class="chapter-kicker">'+(i?'CAPÍTULO '+roman[i]:'PRÓLOGO')+'</div>'+md(text);insertVisuals(a,i);if(i===12)a.append(mapBlock('Mapa A — Sector local · conocimiento hasta XII','art/maps/MAP_A_LOCAL_MASTER.svg','Conocimiento cartográfico acumulado hasta XII.'));if(i===25)a.append(mapBlock('Mapa B — Expansión tras XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg','Expansión conocida únicamente después de XXV.'));book.append(a);const l=document.createElement('a');l.href='#';l.dataset.index=i;l.textContent=roman[i]+'.  '+(a.querySelector('h1')?.textContent||files[i]);l.onclick=e=>{e.preventDefault();go(i)};chap.append(l)}catch(e){}}document.querySelectorAll('.article').forEach((a,i)=>a.append(nav(i)));wire();go(state.chapter);rebuildAtlas()}
function theme(t){state.theme=t;save();document.body.className='theme-'+t;document.getElementById('themeLabel').textContent=t==='paper'?'Papel':t==='black'?'Negro':'Blanco'}
function wire(){document.documentElement.style.setProperty('--reading',state.font+'rem');theme(state.theme);document.querySelectorAll('.illustration img,.map img').forEach(img=>img.onclick=()=>zoom(img));document.getElementById('resumeBtn').onclick=()=>go(state.chapter);document.getElementById('smaller').onclick=()=>{state.font=Math.max(.95,+(state.font-.05).toFixed(2));save();document.documentElement.style.setProperty('--reading',state.font+'rem')};document.getElementById('bigger').onclick=()=>{state.font=Math.min(1.4,+(state.font+.05).toFixed(2));save();document.documentElement.style.setProperty('--reading',state.font+'rem')};document.getElementById('paper').onclick=()=>theme('paper');document.getElementById('black').onclick=()=>theme('black');document.getElementById('atlasTab').onclick=()=>document.getElementById('atlas').scrollTo({top:0,behavior:'smooth'});document.getElementById('settingsTab').onclick=()=>document.getElementById('bigger').focus();document.getElementById('menuBtn').onclick=()=>document.querySelector('.sidebar').scrollIntoView({behavior:'smooth'});document.querySelector('#lightbox button').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')}}
load();
</script></body></html>
