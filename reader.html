<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0d"><title>ELYNDRAN — Libro digital</title>
<style>
:root{--bg:#090b0d;--panel:#0e1114;--panel2:#12161a;--line:#2a3036;--gold:#c9974b;--paper:#f1eee8;--muted:#9aa2a8;--reading:1.08rem}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}.top{position:sticky;top:0;z-index:50;height:64px;display:grid;grid-template-columns:280px 1fr 300px;align-items:center;background:#090b0df5;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{padding:0 20px;color:#f4efe6;letter-spacing:.16em;font-size:1.15rem}.brand span{display:block;color:var(--gold);font:600 .58rem system-ui;letter-spacing:.35em;margin-top:2px}.tabs{display:flex;justify-content:center;gap:26px;font:600 .78rem system-ui}.tabs a{color:#b8bec2;text-decoration:none;padding:22px 0 18px;border-bottom:2px solid transparent}.tabs a.active,.tabs a:hover{color:#fff;border-color:var(--gold)}.top-tools{display:flex;justify-content:flex-end;gap:8px;padding-right:14px}.top-tools button{height:36px;min-width:36px;border:1px solid var(--line);border-radius:8px;background:#0d1013;color:#e7e1d8;cursor:pointer}.progress-row{position:sticky;top:64px;z-index:45;height:34px;display:grid;grid-template-columns:280px 1fr 300px;background:#0b0e11e8;border-bottom:1px solid #181d21}.progress-wrap{grid-column:2;padding:10px 20px}.progress-track{height:5px;background:#171b1f;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#b8843e,#e1b86e)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;min-height:calc(100vh - 98px)}.side{position:sticky;top:98px;height:calc(100vh - 98px);overflow:auto;background:#0b0e11;border-right:1px solid var(--line);padding:18px 16px}.right{border-right:0;border-left:1px solid var(--line)}.resume{border:1px solid #3a3328;background:linear-gradient(180deg,#14110d,#0e0d0b);border-radius:8px;padding:14px;margin-bottom:18px}.resume h3{margin:0 0 4px;font-size:.95rem}.resume p{margin:0 0 12px;color:#b6b0a8;font:500 .75rem system-ui;line-height:1.5}.resume button{width:100%;border:0;border-radius:6px;padding:10px;background:#9d7134;color:white;font:700 .76rem system-ui;cursor:pointer}.side h4{color:var(--gold);font:700 .67rem system-ui;letter-spacing:.08em;text-transform:uppercase;margin:20px 6px 8px}.chapter-list a{display:block;color:#aeb5b9;text-decoration:none;padding:7px 8px;border-left:3px solid transparent;border-radius:4px;font:500 .78rem system-ui;line-height:1.25}.chapter-list a:hover,.chapter-list a.active{background:#171611;color:#f3e8d6;border-left-color:var(--gold)}.reader{max-width:900px;width:100%;margin:0 auto;padding:30px 34px 70px}.reading-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;color:#a9afb2;font:600 .73rem system-ui}.reading-head strong{color:var(--gold);letter-spacing:.08em}.article{display:none;animation:fade .25s ease}.article.active{display:block}.article h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.02;margin:8px 0 22px;color:#f5f1ea}.article p{font-size:var(--reading);line-height:1.85;color:#ded9d1;margin:0 0 1.2rem}.article strong{color:#f3e4c9}.visual{margin:28px 0;border:1px solid #2a2f33;border-radius:10px;overflow:hidden;background:#0d1114}.visual img{display:block;width:100%;max-height:62vh;object-fit:cover}.visual figcaption{padding:10px 12px;color:#c6aa7b;font:600 .72rem system-ui;letter-spacing:.05em}.visual.missing{display:none}.map{margin:30px 0;padding:16px;border:1px solid #3a3328;border-radius:10px;background:#11100d}.map h2{margin:0 0 12px;color:var(--gold);font:700 .86rem system-ui;text-transform:uppercase;letter-spacing:.07em}.map img{width:100%;display:block;background:#d9d2c2;border-radius:6px}.map p{font:500 .72rem system-ui;color:#9c958b;text-align:center;margin:10px 0 0}.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}.chapter-nav a{border:1px solid #342d23;border-radius:8px;padding:12px 14px;color:#d9c3a2;text-decoration:none;font:600 .75rem system-ui}.chapter-nav a:last-child{text-align:right}.right h3{color:var(--gold);font:700 .72rem system-ui;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}.right .intro{font:500 .72rem system-ui;color:#a5adb2;margin:0 0 14px}.atlas-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#101419;margin-bottom:12px}.atlas-card img{width:100%;height:145px;object-fit:cover;display:block;background:#d5cebd;cursor:zoom-in}.atlas-card.map-card img{object-fit:contain}.atlas-card div{padding:8px 9px}.atlas-card b{display:block;font-size:.78rem;color:#e1d4bf}.atlas-card small{font:500 .65rem system-ui;color:#899197}.atlas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.atlas-grid .atlas-card img{height:92px}.lightbox{position:fixed;inset:0;z-index:100;background:#020304ef;display:none;place-items:center;padding:22px}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff35;background:#111;color:#fff;font-size:22px;cursor:pointer}.loading{padding:80px;text-align:center;color:#8d979c;font:600 .8rem system-ui}@keyframes fade{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.top,.progress-row,.shell{grid-template-columns:220px minmax(0,1fr)}.right{display:none}.top-tools{display:none}.shell .side{width:220px}.brand{font-size:.95rem}.progress-wrap{grid-column:2}.tabs{gap:16px}}
@media(max-width:760px){.top{grid-template-columns:1fr auto;height:58px}.brand{padding-left:14px}.tabs{display:none}.progress-row{top:58px;height:28px;grid-template-columns:1fr}.progress-wrap{grid-column:1;padding:9px 12px}.shell{display:block}.side{position:static;height:auto;width:auto!important;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.side .chapter-list{display:flex;overflow:auto;gap:4px}.side h4{display:none}.chapter-list a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.chapter-list a.active{border-left:0;border-bottom-color:var(--gold)}.resume{display:none}.reader{padding:22px 18px 55px}.article h1{font-size:2.4rem}.chapter-nav{grid-template-columns:1fr}.chapter-nav a:last-child{text-align:left}}
</style></head><body>
<header class="top"><div class="brand">ELYNDRAN<span>NOVELA</span></div><nav class="tabs"><a href="#" class="active" data-home>Libro</a><a href="#atlas">Atlas</a></nav><div class="top-tools"><button data-smaller>A−</button><button data-bigger>A+</button><button data-theme>◐</button><button data-top>↑</button></div></header>
<div class="progress-row"><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="progress"></div></div></div></div>
<div class="shell">
<aside class="side"><div class="resume"><h3>Continuar lectura</h3><p id="resumeText">Prólogo</p><button id="resumeBtn">Continuar</button></div><h4>Capítulos</h4><div class="chapter-list" id="chapterList"></div></aside>
<main class="reader"><div class="reading-head"><span>Progreso de lectura</span><strong id="chapterBadge">PRÓLOGO</strong></div><section id="book"><div class="loading">Cargando manuscrito…</div></section></main>
<aside class="side right" id="atlas"><h3>Atlas visual</h3><p class="intro">Mapas e ilustraciones disponibles</p><div id="atlasContent"></div></aside>
</div>
<div class="lightbox" id="lightbox"><button>×</button><img alt="Vista ampliada"></div>
<script>
const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['PRÓLOGO','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
const visuals={0:[['PROLOGO-A','Descenso hacia Elyndran']],1:[['I-A','El primer paso'],['I-I1','Primer mirador']],2:[['II-A','Nivel inferior y discos']],4:[['IV-A','La estructura de tres brazos']],5:[['V-A','La bóveda nueva']],10:[['X-A','Cara inferior de la plataforma']],14:[['XIV-A','Bóveda y partículas']],15:[['XV-A','Interior de la cápsula y prefiltro']],16:[['XVI-A','Exposición dérmica controlada']],25:[['XXV-A','Regreso al primer mirador'],['XXV-I2','Región de cascadas y planeadores']]};
const KEY='elyndran-web-v4';let state={chapter:0,font:1.08,night:true};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){let out=[],p=[];const flush=()=>{if(p.length){let t=esc(p.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');out.push('<p>'+t+'</p>');p=[]}};for(const l of s.split(/\r?\n/)){if(l.startsWith('# ')){flush();out.push('<h1>'+esc(l.slice(2))+'</h1>')}else if(l.trim()==='---'||!l.trim()){flush()}else p.push(l.trim())}flush();return out.join('')}
function visual(id,label){const box=document.createElement('figure');box.className='visual missing';const img=document.createElement('img'),cap=document.createElement('figcaption');img.alt=label;img.loading='lazy';cap.textContent=id+' · '+label;box.append(img,cap);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/'+id+'.webp','art/'+id+'.png','art/'+id+'.jpg'];let n=0;img.onload=()=>{box.classList.remove('missing');buildAtlas()};img.onerror=()=>{if(++n<paths.length)img.src=paths[n]};img.src=paths[0];return box}
function mapBlock(title,src,note){const s=document.createElement('section');s.className='map';s.innerHTML='<h2>'+title+'</h2><img src="'+src+'" alt="'+title+'"><p>'+note+'</p>';return s}
function titleOf(i){const a=document.querySelector('[data-index="'+i+'"]');return a?.querySelector('h1')?.textContent||roman[i]}
function go(i){i=Math.max(0,Math.min(files.length-1,i));state.chapter=i;save();document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));document.querySelectorAll('.chapter-list a').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));document.getElementById('chapterBadge').textContent=roman[i];document.getElementById('resumeText').textContent=roman[i]+' · '+titleOf(i);document.getElementById('progress').style.width=((i+1)/files.length*100)+'%';scrollTo({top:98,behavior:'smooth'})}
function buildAtlas(){const host=document.getElementById('atlasContent');host.innerHTML='<h4 style="margin:8px 0;color:#c9974b;font:700 .65rem system-ui">MAPAS</h4>';[['Mapa A','art/maps/MAP_A_LOCAL_MASTER.svg','Después de XII'],['Mapa B','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg','Después de XXV']].forEach(x=>host.insertAdjacentHTML('beforeend','<figure class="atlas-card map-card"><img src="'+x[1]+'" alt="'+x[0]+'"><div><b>'+x[0]+'</b><small>'+x[2]+'</small></div></figure>'));const imgs=[...document.querySelectorAll('.visual:not(.missing) img')];if(imgs.length){host.insertAdjacentHTML('beforeend','<h4 style="margin:16px 0 8px;color:#c9974b;font:700 .65rem system-ui">ILUSTRACIONES</h4><div class="atlas-grid" id="agrid"></div>');const g=document.getElementById('agrid');imgs.forEach(img=>{const f=img.closest('figure'),c=document.createElement('figure');c.className='atlas-card';c.innerHTML='<img src="'+img.src+'" alt="'+img.alt+'"><div><b>'+f.querySelector('figcaption').textContent+'</b></div>';g.appendChild(c)})}wireZoom()}
function wireZoom(){document.querySelectorAll('.visual img,.map img,.atlas-card img').forEach(img=>{if(img.dataset.z)return;img.dataset.z=1;img.onclick=()=>{document.querySelector('#lightbox img').src=img.src;document.getElementById('lightbox').classList.add('open')}})}
async function load(){const book=document.getElementById('book'),list=document.getElementById('chapterList');book.innerHTML='';for(let i=0;i<files.length;i++){try{const r=await fetch('manuscript/'+files[i]);if(!r.ok)throw Error(r.status);const t=await r.text(),a=document.createElement('article');a.className='article';a.dataset.index=i;a.innerHTML=md(t);if(visuals[i])visuals[i].forEach(([id,label])=>a.insertBefore(visual(id,label),a.querySelector('p')||null));if(i===12)a.appendChild(mapBlock('Mapa A — Sector local','art/maps/MAP_A_LOCAL_MASTER.svg','Conocimiento acumulado hasta XII'));if(i===25)a.appendChild(mapBlock('Mapa B — Expansión XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg','Expansión incorporada tras XXV'));const nav=document.createElement('div');nav.className='chapter-nav';nav.innerHTML=(i?'<a href="#" data-prev>← Anterior<br><b>'+roman[i-1]+'</b></a>':'<span></span>')+(i<files.length-1?'<a href="#" data-next>Siguiente →<br><b>'+roman[i+1]+'</b></a>':'<span></span>');a.appendChild(nav);nav.querySelector('[data-prev]')?.addEventListener('click',e=>{e.preventDefault();go(i-1)});nav.querySelector('[data-next]')?.addEventListener('click',e=>{e.preventDefault();go(i+1)});book.appendChild(a);const l=document.createElement('a');l.href='#';l.dataset.index=i;l.textContent=roman[i]+' · '+(a.querySelector('h1')?.textContent||'');l.onclick=e=>{e.preventDefault();go(i)};list.appendChild(l)}catch(e){book.insertAdjacentHTML('beforeend','<div class="loading">No se pudo cargar '+files[i]+'</div>')}}buildAtlas();go(state.chapter||0);wireZoom()}
document.getElementById('resumeBtn').onclick=()=>go(state.chapter||0);document.querySelector('[data-smaller]').onclick=()=>{state.font=Math.max(.94,state.font-.05);document.documentElement.style.setProperty('--reading',state.font+'rem');save()};document.querySelector('[data-bigger]').onclick=()=>{state.font=Math.min(1.4,state.font+.05);document.documentElement.style.setProperty('--reading',state.font+'rem');save()};document.querySelector('[data-top]').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.querySelector('[data-theme]').onclick=()=>document.body.classList.toggle('soft');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox'||e.target.tagName==='BUTTON')e.currentTarget.classList.remove('open')};document.documentElement.style.setProperty('--reading',state.font+'rem');load();
</script></body></html>
