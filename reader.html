<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d10">
<title>ELYNDRAN — Libro digital</title>
<style>
:root{--bg:#090d10;--paper:#f3efe5;--ink:#20272b;--muted:#74807f;--line:#c9c1b3;--accent:#9eb9ae}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:20;width:0}.hero{min-height:94vh;display:grid;place-items:center;text-align:center;padding:4rem 1.5rem;background:radial-gradient(circle at 50% 28%,#284548 0,#142326 32%,#090d10 68%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,#090d10);pointer-events:none}.hero>div{position:relative;z-index:1}.hero .kicker{font:600 .78rem/1.6 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#b9c8c4}.hero h1{font-size:clamp(3.2rem,11vw,8.5rem);letter-spacing:.15em;margin:.25em 0 .1em}.hero .sub{font:400 clamp(.9rem,2vw,1.08rem)/1.6 system-ui,sans-serif;letter-spacing:.12em;color:#c4cfcc}.hero a{display:inline-block;margin-top:3rem;color:#e5ecea;text-decoration:none;border:1px solid #ffffff35;border-radius:999px;padding:.8rem 1.15rem;font:600 .82rem system-ui,sans-serif}nav{position:sticky;top:0;z-index:10;background:#090d10ed;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff1c;padding:.72rem .8rem;display:flex;gap:.55rem;overflow:auto;font:600 .76rem system-ui,sans-serif}nav a{color:#c9d3d0;text-decoration:none;white-space:nowrap;padding:.42rem .66rem;border:1px solid #ffffff17;border-radius:999px}nav a:hover{border-color:#ffffff45}main{max-width:850px;margin:auto;background:var(--paper);color:var(--ink);box-shadow:0 0 90px #000;padding:clamp(2rem,7vw,5rem) clamp(1.35rem,7vw,5rem)}article{padding:2.5rem 0 5.5rem;border-bottom:1px solid var(--line);scroll-margin-top:70px}article h1{font-size:clamp(2.15rem,6vw,3.7rem);line-height:1.03;margin:0 0 2.6rem;letter-spacing:-.02em}article p{font-size:1.14rem;line-height:1.84;margin:0 0 1.28rem}article strong{font-family:ui-monospace,monospace;font-size:.93em}.visual{margin:0 calc(50% - 50vw) 4rem;background:#0d1214;color:#eef3f1}.visual figure{margin:0}.visual img{display:block;width:100%;height:min(78vh,900px);object-fit:cover;background:#101719}.visual figcaption{max-width:850px;margin:auto;padding:1rem max(1.35rem,calc((100vw - 850px)/2));font:500 .78rem/1.5 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#aebbb7}.visual.missing{display:none}.map{margin:1rem calc(50% - 50vw) 5rem;padding:3rem max(1rem,calc((100vw - 850px)/2));background:#ddd4c2;color:#222}.map img{width:100%;max-height:85vh;object-fit:contain;display:block}.map h2{text-align:center;font:700 1.15rem system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 1.5rem}.map p{text-align:center;font:500 .75rem system-ui,sans-serif;color:#5d5a53}.loading{padding:7rem 1rem;text-align:center;font-family:system-ui,sans-serif}.error{padding:2rem;background:#f3d4d4;color:#6c2020}.status{margin:0 auto 2rem;max-width:680px;padding:.75rem 1rem;border:1px solid #ffffff1e;border-radius:12px;color:#99aaa5;font:500 .78rem/1.5 system-ui,sans-serif;text-align:center}footer{text-align:center;padding:4rem 1rem;color:#87918f;font:500 .78rem/1.6 system-ui,sans-serif}@media(max-width:600px){main{padding:1.8rem 1.2rem}article p{font-size:1.055rem;line-height:1.75}.visual{margin-left:-1.2rem;margin-right:-1.2rem}.visual img{height:auto;max-height:74vh;object-fit:contain}.visual figcaption{padding:.85rem 1.2rem}.map{margin-left:-1.2rem;margin-right:-1.2rem;padding:2rem .75rem}.hero h1{letter-spacing:.1em}}
</style>
</head><body>
<div class="progress" id="progress"></div>
<header class="hero"><div><div class="kicker">Edición unificada · Prólogo + I–XXV</div><h1>ELYNDRAN</h1><div class="sub">Una expedición donde el suelo todavía no existe</div><a href="#prologo">Comenzar a leer ↓</a></div></header>
<nav id="toc"><a href="#prologo">Prólogo</a></nav>
<main id="book"><div class="loading">Cargando manuscrito…</div></main>
<footer>ELYNDRAN · edición HTML de trabajo · el texto se carga desde el manuscrito canónico</footer>
<script>
const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
const visuals={
0:[['PROLOGO-A','Descenso hacia Elyndran']],
1:[['I-A','El primer paso'],['I-I1','Primer mirador']],
2:[['II-A','Nivel inferior y discos']],
4:[['IV-A','La estructura de tres brazos']],
5:[['V-A','La bóveda nueva']],
10:[['X-A','Cara inferior de la plataforma']],
14:[['XIV-A','Bóveda y partículas']],
15:[['XV-A','Interior de la cápsula y prefiltro']],
16:[['XVI-A','Exposición dérmica controlada']],
25:[['XXV-A','Regreso al primer mirador'],['XXV-I2','Región de cascadas y planeadores']]
};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(s){let out=[],para=[];const flush=()=>{if(para.length){let t=esc(para.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');out.push('<p>'+t+'</p>');para=[]}};for(const line of s.split(/\r?\n/)){if(line.startsWith('# ')){flush();out.push('<h1>'+esc(line.slice(2))+'</h1>')}else if(line.trim()==='---'){flush()}else if(!line.trim()){flush()}else para.push(line.trim())}flush();return out.join('\n')}
function visual(id,label){const box=document.createElement('section');box.className='visual missing';const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.alt=label+' — ELYNDRAN';img.loading='lazy';cap.textContent=label;fig.append(img,cap);box.appendChild(fig);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/'+id+'.webp','art/'+id+'.png','art/'+id+'.jpg'];let n=0;img.onload=()=>box.classList.remove('missing');img.onerror=()=>{n++;if(n<paths.length)img.src=paths[n]};img.src=paths[0];return box}
function map(title,src,alt,note){const s=document.createElement('section');s.className='map';s.innerHTML='<h2>'+title+'</h2><img loading="lazy" src="'+src+'" alt="'+alt+'"><p>'+note+'</p>';return s}
async function load(){const book=document.getElementById('book'),toc=document.getElementById('toc');book.innerHTML='';for(let i=0;i<files.length;i++){try{const r=await fetch('manuscript/'+files[i]);if(!r.ok)throw new Error(r.status);const text=await r.text(),a=document.createElement('article');a.id=i?'cap-'+roman[i].toLowerCase():'prologo';a.innerHTML=md(text);if(visuals[i])visuals[i].forEach(([id,label])=>a.prepend(visual(id,label)));book.appendChild(a);if(i){const l=document.createElement('a');l.href='#'+a.id;l.textContent=roman[i];toc.appendChild(l)}if(i===12)book.appendChild(map('Mapa A — Sector local · conocimiento hasta XII','art/maps/MAP_A_LOCAL_MASTER.svg','Mapa A del sector local de Elyndran','El mapa no revela conocimiento posterior a XII.'));if(i===25)book.appendChild(map('Mapa B — Expansión tras XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg','Mapa B de expansión de Elyndran','La expansión se incorpora solo después de XXV.'))}catch(e){book.insertAdjacentHTML('beforeend','<div class="error">No se pudo cargar '+files[i]+'</div>')}}}
window.addEventListener('scroll',()=>{const d=document.documentElement,m=d.scrollHeight-d.clientHeight,p=m?d.scrollTop/m*100:0;document.getElementById('progress').style.width=p+'%'});load();
</script></body></html>
