<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d0f">
<title>ELYNDRAN — Libro ilustrado</title>
<style>
:root{--bg:#0b0d0f;--panel:#101316;--paper:#f4efe5;--ink:#24211e;--muted:#7d766e;--gold:#b98a45;--line:#d7cfc2;--reading:1.08rem;--page:860px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#eee;font-family:Georgia,'Times New Roman',serif}.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b0d0ff2;border-bottom:1px solid #24292d;backdrop-filter:blur(12px)}.brand{letter-spacing:.18em;font-size:1rem}.brand small{display:block;color:var(--gold);font:600 .5rem system-ui;letter-spacing:.34em;margin-top:2px}.tools{display:flex;gap:7px}.tools button{border:1px solid #30353a;background:#111519;color:#eee;border-radius:7px;min-width:34px;height:34px;cursor:pointer}.progress{position:fixed;top:58px;left:0;height:3px;background:linear-gradient(90deg,#a87735,#e4be79);width:0;z-index:31}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;border-right:1px solid #252a2e;background:#0d1013;padding:16px 12px}.resume{border:1px solid #3a3022;border-radius:9px;padding:12px;background:#12110f;margin-bottom:16px}.resume b{display:block;font-size:.9rem;margin-bottom:4px}.resume span{display:block;color:#aaa49b;font:500 .72rem/1.4 system-ui;margin-bottom:10px}.resume button{width:100%;border:0;border-radius:6px;padding:9px;background:#9d7134;color:#fff;font:700 .72rem system-ui}.sidebar h3{color:var(--gold);font:700 .65rem system-ui;letter-spacing:.12em;text-transform:uppercase;margin:18px 7px 7px}.chapters a{display:block;color:#aeb4b8;text-decoration:none;padding:7px 8px;border-left:3px solid transparent;border-radius:4px;font:500 .74rem/1.25 system-ui}.chapters a.active{color:#fff0d8;background:#171612;border-left-color:var(--gold)}.main{padding:30px 20px 80px}.book{max-width:var(--page);margin:0 auto}.article{display:none;background:var(--paper);color:var(--ink);padding:clamp(28px,5vw,64px);box-shadow:0 20px 70px #0007;min-height:70vh}.article.active{display:block}.chapter-kicker{color:#9b6c2d;font:700 .72rem system-ui;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.article h1{font-size:clamp(2.3rem,6vw,4.5rem);line-height:1;margin:0 0 2rem;color:var(--ink);letter-spacing:-.03em}.article p{font-size:var(--reading);line-height:1.86;margin:0 0 1.28rem;color:var(--ink)}.article strong{color:#201b15}.illustration{margin:2.2rem -8% 2.5rem;background:#111;border:1px solid #cfc4b5;box-shadow:0 12px 35px #0003}.illustration img{display:block;width:100%;max-height:74vh;object-fit:cover;background:#151515}.illustration figcaption{padding:10px 14px;color:#d8cab4;background:#111;font:600 .7rem/1.4 system-ui;letter-spacing:.06em}.illustration.missing{display:none}.map{margin:3rem -4% 2rem;padding:16px;background:#e3dacb;border:1px solid #cfc2ad}.map h2{font:700 .8rem system-ui;color:#6f4e22;letter-spacing:.08em;text-transform:uppercase;text-align:center}.map img{display:block;width:100%;max-height:76vh;object-fit:contain}.map p{font:500 .7rem system-ui;color:#655f57;text-align:center;margin:8px 0 0}.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2.5rem;padding-top:1.4rem;border-top:1px solid var(--line)}.chapter-nav button{border:1px solid #c4b9a9;background:#efe7db;color:#4a3c2b;padding:12px;border-radius:7px;font:700 .75rem system-ui;cursor:pointer}.chapter-nav button:last-child{text-align:right}.atlas{max-width:var(--page);margin:34px auto 0;padding:24px;color:#ddd}.atlas h2{color:#f2e5cf;margin:0 0 6px}.atlas p{color:#9da3a7;font:500 .8rem system-ui}.atlas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.atlas-card{margin:0;border:1px solid #292f34;background:#101419}.atlas-card img{display:block;width:100%;height:150px;object-fit:cover;cursor:zoom-in}.atlas-card.map-card img{object-fit:contain;background:#ddd4c4}.atlas-card figcaption{padding:9px 10px;font:600 .7rem/1.3 system-ui;color:#d6c6ad}.lightbox{position:fixed;inset:0;z-index:100;background:#020304ef;display:none;place-items:center;padding:20px}.lightbox.open{display:grid}.lightbox img{max-width:96vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;background:#111;color:#fff;font-size:22px}.theme-paper body{}.theme-black .article{background:#111517;color:#e7e1d9}.theme-black .article h1,.theme-black .article p,.theme-black .article strong{color:#e7e1d9}.theme-black .chapter-kicker{color:#d0a05b}.theme-white body{background:#f3f3f3}.theme-white .sidebar,.theme-white .top{background:#fff;color:#111}.theme-white .sidebar{border-color:#ddd}.theme-white .chapters a{color:#555}.theme-white .chapters a.active{color:#111;background:#f0ece4}.theme-white .article{background:#fff;color:#111}.theme-white .article h1,.theme-white .article p,.theme-white .article strong{color:#111}@media(max-width:780px){.layout{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid #24292d;padding:8px}.resume,.sidebar h3{display:none}.chapters{display:flex;overflow:auto;gap:4px}.chapters a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.chapters a.active{border-left:0;border-bottom-color:var(--gold)}.main{padding:18px 0 50px}.book{max-width:none}.article{padding:24px 18px;box-shadow:none}.article h1{font-size:2.55rem}.illustration{margin:1.8rem -18px 2.2rem;border-left:0;border-right:0}.map{margin:2.3rem -18px 1.8rem;border-left:0;border-right:0}.chapter-nav{grid-template-columns:1fr}.chapter-nav button:last-child{text-align:left}.atlas{padding:22px 14px}.tools button:nth-child(1),.tools button:nth-child(2){display:none}}
</style>
</head><body class="theme-paper">
<header class="top"><div class="brand">ELYNDRAN<small>NOVELA ILUSTRADA</small></div><div class="tools"><button id="smaller">A−</button><button id="bigger">A+</button><button id="paper" title="Papel">P</button><button id="black" title="Negro">N</button><button id="white" title="Blanco">B</button><button id="topBtn">↑</button></div></header><div class="progress" id="progress"></div>
<div class="layout"><aside class="sidebar"><div class="resume"><b>Continuar lectura</b><span id="resumeText">Prólogo</span><button id="resumeBtn">Continuar</button></div><h3>Capítulos</h3><nav class="chapters" id="chapters"></nav></aside><main class="main"><div class="book" id="book">Cargando manuscrito…</div><section class="atlas" id="atlas"><h2>Atlas visual</h2><p>Índice secundario de mapas e ilustraciones ya presentes en el libro.</p><div class="atlas-grid" id="atlasGrid"></div></section></main></div>
<div class="lightbox" id="lightbox"><button>×</button><img alt="Vista ampliada"></div>
<script>
const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['PRÓLOGO','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
const placements={0:[['PROLOGO-A','Descenso hacia Elyndran',4]],1:[['I-A','El primer paso',3],['I-I1','Primer mirador',11]],2:[['II-A','Nivel inferior y discos',7]],4:[['IV-A','La estructura de tres brazos',8]],5:[['V-A','La bóveda nueva',6]],10:[['X-A','Cara inferior de la plataforma',10]],14:[['XIV-A','Bóveda y partículas',7]],15:[['XV-A','Interior de la cápsula y prefiltro',6]],16:[['XVI-A','Exposición dérmica controlada',8]],25:[['XXV-A','Regreso al primer mirador',8],['XXV-I2','Región de cascadas y planeadores',18]]};
const KEY='elyndran-inline-v1';let state={chapter:0,font:1.08,theme:'paper'};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){let out=[],p=[];const flush=()=>{if(p.length){let t=esc(p.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');out.push('<p>'+t+'</p>');p=[]}};for(const l of s.split(/\r?\n/)){if(l.startsWith('# ')){flush();out.push('<h1>'+esc(l.slice(2))+'</h1>')}else if(!l.trim()||l.trim()==='---'){flush()}else p.push(l.trim())}flush();return out.join('')}
function illustration(id,label){const f=document.createElement('figure');f.className='illustration missing';const img=document.createElement('img'),cap=document.createElement('figcaption');img.loading='lazy';img.alt=label+' — ELYNDRAN';cap.textContent=id+' · '+label;f.append(img,cap);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/'+id+'.webp','art/'+id+'.png','art/'+id+'.jpg'];let n=0;img.onload=()=>{f.classList.remove('missing');rebuildAtlas()};img.onerror=()=>{if(++n<paths.length)img.src=paths[n]};img.src=paths[0];return f}
function insertVisuals(article,index){const list=placements[index]||[];for(const [id,label,after] of list){const fig=illustration(id,label),paras=article.querySelectorAll('p');const target=paras[Math.min(after,paras.length)-1];if(target)target.after(fig);else article.append(fig)}}
function mapBlock(title,src,note){const s=document.createElement('section');s.className='map';s.innerHTML='<h2>'+title+'</h2><img src="'+src+'" alt="'+title+'"><p>'+note+'</p>';return s}
function titleOf(i){return document.querySelector('.article[data-index="'+i+'"] h1')?.textContent||roman[i]}
function go(i){i=Math.max(0,Math.min(files.length-1,i));state.chapter=i;save();document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));document.querySelectorAll('#chapters a').forEach(a=>a.classList.toggle('active',+a.dataset.index===i));document.getElementById('resumeText').textContent=roman[i]+' · '+titleOf(i);document.getElementById('progress').style.width=((i+1)/files.length*100)+'%';scrollTo({top:58,behavior:'smooth'})}
function nav(i){const d=document.createElement('div');d.className='chapter-nav';const prev=document.createElement('button'),next=document.createElement('button');prev.textContent=i?'← '+titleOf(i-1):'Inicio';next.textContent=i<files.length-1?titleOf(i+1)+' →':'Fin del libro';prev.disabled=!i;next.disabled=i===files.length-1;prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);d.append(prev,next);return d}
function zoom(img){document.querySelector('#lightbox img').src=img.src;document.getElementById('lightbox').classList.add('open')}
function rebuildAtlas(){const grid=document.getElementById('atlasGrid');grid.innerHTML='';[['Mapa A','art/maps/MAP_A_LOCAL_MASTER.svg'],['Mapa B','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg']].forEach(([label,src])=>{const f=document.createElement('figure');f.className='atlas-card map-card';f.innerHTML='<img src="'+src+'" alt="'+label+'"><figcaption>'+label+'</figcaption>';grid.append(f)});document.querySelectorAll('.illustration:not(.missing)').forEach(f=>{const img=f.querySelector('img'),c=document.createElement('figure');c.className='atlas-card';c.innerHTML='<img src="'+img.src+'" alt="'+img.alt+'"><figcaption>'+f.querySelector('figcaption').textContent+'</figcaption>';grid.append(c)});grid.querySelectorAll('img').forEach(img=>img.onclick=()=>zoom(img))}
async function load(){const book=document.getElementById('book'),chap=document.getElementById('chapters');book.innerHTML='';for(let i=0;i<files.length;i++){try{const r=await fetch('manuscript/'+files[i]);if(!r.ok)throw new Error(r.status);const text=await r.text(),a=document.createElement('article');a.className='article';a.dataset.index=i;a.innerHTML='<div class="chapter-kicker">'+roman[i]+'</div>'+md(text);insertVisuals(a,i);if(i===12)a.append(mapBlock('Mapa A — Sector local · conocimiento hasta XII','art/maps/MAP_A_LOCAL_MASTER.svg','Conocimiento cartográfico acumulado hasta XII.'));if(i===25)a.append(mapBlock('Mapa B — Expansión tras XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg','Expansión conocida únicamente después de XXV.'));book.append(a);const l=document.createElement('a');l.href='#';l.dataset.index=i;l.textContent=roman[i]+' · '+(a.querySelector('h1')?.textContent||files[i]);l.onclick=e=>{e.preventDefault();go(i)};chap.append(l)}catch(e){}}document.querySelectorAll('.article').forEach((a,i)=>a.append(nav(i)));wire();go(state.chapter);rebuildAtlas()}
function theme(t){state.theme=t;save();document.body.className='theme-'+t}function wire(){document.documentElement.style.setProperty('--reading',state.font+'rem');theme(state.theme);document.querySelectorAll('.illustration img,.map img').forEach(img=>img.onclick=()=>zoom(img));document.getElementById('resumeBtn').onclick=()=>go(state.chapter);document.getElementById('smaller').onclick=()=>{state.font=Math.max(.95,+(state.font-.05).toFixed(2));save();document.documentElement.style.setProperty('--reading',state.font+'rem')};document.getElementById('bigger').onclick=()=>{state.font=Math.min(1.4,+(state.font+.05).toFixed(2));save();document.documentElement.style.setProperty('--reading',state.font+'rem')};document.getElementById('paper').onclick=()=>theme('paper');document.getElementById('black').onclick=()=>theme('black');document.getElementById('white').onclick=()=>theme('white');document.getElementById('topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.querySelector('#lightbox button').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')}}
load();
</script></body></html>
