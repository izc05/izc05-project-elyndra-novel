<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>ELYNDRAN — Libro ilustrado</title><style>:root{--bg:#0b0d0f;--paper:#f3eee4;--ink:#26211c;--gold:#b98a45;--read:1.08rem}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Georgia,'Times New Roman',serif;color:#eee}.top{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0d0ff2;border-bottom:1px solid #262b2f}.brand{letter-spacing:.18em}.brand small{display:block;color:var(--gold);font:600 .5rem system-ui;letter-spacing:.3em}.tools{display:flex;gap:6px}.tools button{height:34px;min-width:34px;border:1px solid #30363b;background:#11161a;color:#eee;border-radius:7px}.progress{position:fixed;top:58px;left:0;height:3px;background:linear-gradient(90deg,#a87735,#e8c27d);z-index:21}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:14px 10px;border-right:1px solid #262b2f;background:#0e1114}.side h3{color:var(--gold);font:700 .65rem system-ui;letter-spacing:.1em;text-transform:uppercase}.side a{display:block;color:#aeb5b9;text-decoration:none;padding:7px 8px;border-left:3px solid transparent;border-radius:4px;font:500 .74rem/1.25 system-ui}.side a.active{color:#fff0d8;background:#171612;border-left-color:var(--gold)}main{padding:28px 18px 70px}.book{max-width:860px;margin:auto}.article{display:none;background:var(--paper);color:var(--ink);padding:clamp(26px,5vw,60px);box-shadow:0 20px 70px #0007}.article.active{display:block}.kick{color:#9b6c2d;font:700 .72rem system-ui;letter-spacing:.12em;text-transform:uppercase}.article h1{font-size:clamp(2.3rem,6vw,4.5rem);line-height:1;margin:.35rem 0 1.55rem}.article p{font-size:var(--read);line-height:1.86;margin:0 0 1.25rem}.story-pa y{background:#f3f3f3}.theme-white .article{background:#fff;color:#111}.theme-white .article h1,.theme-white .article p{color:#111}@media(max-width:760px){.layout{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid #262b2f;padding:7px}.chapters{display:flex;overflow:auto}.side h3{display:none}.side a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.side a.active{border-left:0;border-bottom-color:var(--gold)}main{padding:18px 0 50px}.article{padding:24px 18px;box-shadow:none}.ill,.ill.opening{margin:1.55rem -18px 2rem;border-left:0;border-right:0}.ill img,.ill.opening img{max-height:none;aspect-ratio:3/2;object-fit:cover}.map{margin:2.2rem -18px 1.8rem}.nav{grid-template-columns:1fr}.tools button:nth-child(1),.tools button:nth-child(2){display:none}}</style></head><body class="theme-paper"><header class="top"><div class="brand">ELYNDRAN<small>NOVELA ILUSTRADA</small></div><div class="tools"><button id="smaller">A−</button><button id="bigger">A+</button><button data-theme="paper">P</button><button data-theme="black">N</button><button data-theme="white">B</button></div></header><div class="progress" id="progress"></div><div class="layout"><aside class="side"><h3>Capítulos</h3><nav class="chapters" id="chapters"></nav></aside><main><div class="book" id="book">Cargando…</div><details class="atlas"><summary>Atlas visual</summary><div class="atlas-grid" id="atlas"></div></details></main></div><script>const files=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];const roman=['PROLOGO','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];const displayRoman=['PRÓLOGO','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];const openingLabels=['Descenso hacia Elyndran','El primer paso','Nivel inferior y discos','La ruta que respira','La estructura de tres brazos','La bóveda nueva','La segunda visita','La parte seca','El agua que no era agua','Antes de tocar la raíz','El margen de una hora','La órbita vacía','El mismo camino','La mitad de una ración','Bóveda y partículas','Interior de la cápsula y prefiltro','Exposición dérmica controlada','La mañana siguiente','La ración que no se calentó','La fotografía de XIII','Antes de la llamada','Antes de apoyar el pie','Lo que entra','Lo que dejas fuera','Lo que pesa','Regreso al primer mirador'];const extraKnown={1:[['I-I1','Primer mirador',11]],10:[['X-I1','La primera línea recta',22],['X-I2','La cara inferior parcial',36]],17:[['XVII-I1','La cavidad casi seca',20],['XVII-I2','La película asciende',35]],18:[['XVIII-I1','El contacto marcado',11],['XVIII-I2','Elegir qué sigue encendido',55]],19:[['XIX-I1','La franja ya no es igual',25],['XIX-I2','Comparación dentro de la cápsula',50]],25:[['XXV-I2','Región de cascadas y planeadores',18]]};let current=+(localStorage.getItem('elyndran-chapter')||0);function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){const pages=s.split(/\r?\n\s*---\s*\r?\n/);const parse=part=>{let o=[],p=[];const f=()=>{if(p.length){o.push('<p>'+esc(p.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')+'</p>');p=[]}};for(const l of part.split(/\r?\n/)){if(l.startsWith('# ')){f();o.push('<h1>'+esc(l.slice(2))+'</h1>')}else if(!l.trim()){f()}else p.push(l.trim())}f();return o.join('')};return pages.map((part,i)=>'<section class="story-page" data-page="'+(i+1)+'" aria-label="Página '+(i+1)+' de '+pages.length+'">'+parse(part)+'<div class="page-no">Página '+(i+1)+' de '+pages.length+'</div></section>').join('')}function ill(id,label,opening=false){const f=document.createElement('figure');f.className='ill missing'+(opening?' opening':'');const img=document.createElement('img');const cap=document.createElement('figcaption');cap.textContent=id+' · '+label;img.alt=label+' — ELYNDRAN';img.decoding='async';if(opening)img.fetchPriority='high';f.append(img,cap);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/masters/'+id+'.svg'];let n=0;const probe=new Image();const next=()=>{if(n>=paths.length)return;probe.src=paths[n++]+'?v=20260829-3'};probe.onload=()=>{img.src=probe.src;f.classList.remove('missing');atlas()};probe.onerror=next;next();return f}function putOpening(a,i){const h=a.querySelector('h1');if(!h)return;h.after(ill(roman[i]+'-A',openingLabels[i],true))}function putInteriors(a,i){const ps=a.querySelectorAll('p');if(!ps.length)return;const auto=[[''+roman[i]+'-I1','Escena interior I',Math.max(2,Math.round(ps.length*.36))],[''+roman[i]+'-I2','Escena interior II',Math.max(4,Math.round(ps.length*.70))]];const known=extraKnown[i]||[];const merged=[...auto.filter(x=>!known.some(k=>k[0]===x[0])),...known];for(const [id,label,after] of merged){const fig=ill(id,label),now=a.querySelectorAll('p'),t=now[Math.min(after,now.length)-1];t?t.after(fig):a.append(fig)}}function map(title,src){const s=document.createElement('section');s.className='map';s.innerHTML='<h2>'+title+'</h2><img src="'+src+'" alt="'+title+'">';return s}function go(i){current=Math.max(0,Math.min(files.length-1,i));localStorage.setItem('elyndran-chapter',current);document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',+a.dataset.i===current));document.querySelectorAll('#chapters a').forEach(a=>a.classList.toggle('active',+a.dataset.i===current));progress.style.width=((current+1)/files.length*100)+'%';scrollTo({top:58,behavior:'smooth'})}function atlas(){const g=document.getElementById('atlas');g.innerHTML='';[['Mapa A','art/maps/MAP_A_LOCAL_MASTER.svg'],['Mapa B','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg']].forEach(([l,s])=>g.insertAdjacentHTML('beforeend','<figure class="card"><img src="'+s+'" alt="'+l+'"><figcaption>'+l+'</figcaption></figure>'));document.querySelectorAll('.ill:not(.missing)').forEach(f=>g.insertAdjacentHTML('beforeend','<figure class="card"><img src="'+f.querySelector('img').src+'" alt="'+f.querySelector('img').alt+'"><figcaption>'+f.querySelector('figcaption').textContent+'</figcaption></figure>'))}async function load(){book.innerHTML='';chapters.innerHTML='';for(let i=0;i<files.length;i++){const r=await fetch('manuscript/'+files[i]);const a=document.createElement('article');a.className='article';a.dataset.i=i;a.innerHTML='<div class="kick">'+displayRoman[i]+'</div>'+md(await r.text());putOpening(a,i);putInteriors(a,i);if(i===12)a.append(map('Mapa A — Sector local','art/maps/MAP_A_LOCAL_MASTER.svg'));if(i===25)a.append(map('Mapa B — Expansión tras XXV','art/maps/MAP_B_XXV_EXPANSION_MASTER.svg'));const nav=document.createElement('div');nav.className='nav';nav.innerHTML='<button '+(!i?'disabled':'')+'>← Anterior</button><button '+(i===files.length-1?'disabled':'')+'>Siguiente →</button>';nav.children[0].onclick=()=>go(i-1);nav.children[1].onclick=()=>go(i+1);a.append(nav);book.append(a);const l=document.createElement('a');l.href='javascript:void(0)';l.dataset.i=i;l.textContent=displayRoman[i]+' · '+a.querySelector('h1').textContent;l.onclick=()=>go(i);chapters.append(l)}go(current);atlas()}smaller.onclick=()=>{const n=Math.max(.96,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read'))-.05);document.documentElement.style.setProperty('--read',n+'rem')};bigger.onclick=()=>{const n=Math.min(1.4,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read'))+.05);document.documentElement.style.setProperty('--read',n+'rem')};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>document.body.className='theme-'+b.dataset.theme);load();</script></body></html>
