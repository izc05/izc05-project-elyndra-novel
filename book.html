<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c0e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ELYNDRAN — Libro ilustrado</title>
<style>
:root{--bg:#090c0e;--panel:#0d1114;--paper:#f3eee4;--ink:#25201b;--gold:#b98a45;--muted:#9ba1a4;--read:1.08rem}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#172229 0,#090c0e 34%,#060809 100%);color:#eee;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#090c0ef5;border-bottom:1px solid #2a3034;backdrop-filter:blur(14px)}.brand{font-size:.92rem;letter-spacing:.18em;color:#efe4d2}.brand small{display:block;color:var(--gold);font:700 .47rem system-ui;letter-spacing:.3em;margin-top:2px}.tools{display:flex;gap:6px}.tools button{height:34px;min-width:34px;padding:0 9px;border:1px solid #343b40;background:#11171a;color:#eee;border-radius:7px;cursor:pointer}.progress{position:fixed;top:60px;left:0;height:3px;width:0;background:linear-gradient(90deg,#9f6d31,#e7be76);z-index:31;transition:width .25s}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 60px)}.side{position:sticky;top:63px;height:calc(100vh - 63px);overflow:auto;padding:16px 10px;border-right:1px solid #262e33;background:#0a0e11}.side h3{margin:5px 8px 10px;color:var(--gold);font:700 .66rem system-ui;letter-spacing:.11em;text-transform:uppercase}.chapters a{display:block;color:#aeb5b9;text-decoration:none;padding:8px 9px;border-left:3px solid transparent;border-radius:4px;font:500 .75rem/1.3 system-ui}.chapters a.active{color:#fff0d8;background:linear-gradient(90deg,#362719,transparent);border-left-color:var(--gold)}main{min-width:0;padding:28px 18px 70px}.book{max-width:880px;margin:auto}.loading{max-width:760px;margin:10vh auto;text-align:center;color:#bfb7aa;font:500 .9rem/1.7 system-ui}.article{display:none;background:var(--paper);color:var(--ink);padding:clamp(28px,5vw,62px);box-shadow:0 22px 74px #0008;border-radius:5px;min-height:76vh}.article.active{display:block}.kick{color:#98692f;font:700 .7rem system-ui;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}.article h1{font-size:clamp(2.25rem,6vw,4.3rem);line-height:1.02;margin:.25rem 0 1.7rem;letter-spacing:-.025em}.article p{font-size:var(--read);line-height:1.84;margin:0 0 1.22rem}.article em{color:#4f463d}.story-page{padding-bottom:1.8rem;margin-bottom:2rem;border-bottom:1px solid #d6ccbd}.story-page:last-of-type{border-bottom:0}.page-no{text-align:right;color:#968978;font:600 .6rem system-ui;letter-spacing:.09em;text-transform:uppercase;margin-top:1.4rem}.ill{margin:2.15rem -5% 2.5rem;background:#0d1012;border:1px solid #b9aa92;overflow:hidden;box-shadow:0 14px 36px #0004}.ill.opening{margin-top:.8rem}.ill img{display:block;width:100%;max-height:76vh;object-fit:cover}.ill.opening img{max-height:68vh}.ill figcaption{padding:9px 12px;background:#0e1113;color:#d9c7aa;font:600 .68rem/1.4 system-ui;letter-spacing:.04em}.ill.missing{display:none}.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2.4rem;padding-top:1.3rem;border-top:1px solid #cec3b4}.nav button{padding:12px 14px;border:1px solid #c5b8a5;background:#eee5d8;color:#493b2b;border-radius:7px;font:700 .75rem system-ui}.nav button:last-child{text-align:right}.nav button:disabled{opacity:.35}.atlas{max-width:880px;margin:30px auto 0;border-top:1px solid #2b3236;padding-top:10px}.atlas summary{cursor:pointer;color:#d8c8ae;font:700 .76rem system-ui;letter-spacing:.09em;text-transform:uppercase;padding:12px 2px}.atlas[open] summary{color:var(--gold)}.atlas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{margin:0;border:1px solid #2b3236;background:#101519}.card img{display:block;width:100%;height:160px;object-fit:cover}.card figcaption{padding:9px 10px;color:#d7c6aa;font:600 .68rem/1.35 system-ui}.theme-black .article{background:#111619;color:#e8e1d7}.theme-black .article h1,.theme-black .article p{color:#e8e1d7}.theme-black .story-page{border-color:#30363a}.theme-white{background:#eee}.theme-white .article{background:#fff;color:#171717}.theme-white .side,.theme-white .top{background:#fff;color:#111}.theme-white .chapters a{color:#555}.theme-white .chapters a.active{color:#111;background:#eee5da}
@media(max-width:900px),(hover:none) and (pointer:coarse){.top{height:56px;padding:0 10px}.progress{top:56px}.brand{font-size:.82rem}.layout{display:block}.side{position:sticky;top:59px;z-index:20;height:auto;padding:6px 7px;border-right:0;border-bottom:1px solid #283035;overflow:hidden}.side h3{display:none}.chapters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chapters::-webkit-scrollbar{display:none}.chapters a{flex:0 0 auto;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:0;border-bottom:2px solid transparent;padding:9px 10px}.chapters a.active{border-left:0;border-bottom-color:var(--gold);background:#342619}main{padding:12px 0 50px}.book{max-width:none}.article{padding:26px 19px 34px;border-radius:0;box-shadow:none;min-height:72vh}.article h1{font-size:clamp(2rem,10vw,3rem);line-height:1.04}.article p{line-height:1.76}.ill,.ill.opening{margin:1.65rem -19px 2rem;border-left:0;border-right:0}.ill img,.ill.opening img{max-height:none;aspect-ratio:3/2;object-fit:cover}.nav{grid-template-columns:1fr}.nav button:last-child{text-align:left}.atlas{padding:0 14px}.tools button[data-font]{display:none}}
@media print{.top,.side,.progress,.atlas,.nav{display:none!important}.layout{display:block}.article{display:block!important;box-shadow:none;padding:0}.story-page{break-after:page;border:0}.ill{break-inside:avoid}}
</style>
</head>
<body class="theme-paper">
<header class="top"><div class="brand">ELYNDRAN<small>NOVELA ILUSTRADA</small></div><div class="tools"><button id="smaller" data-font>A−</button><button id="bigger" data-font>A+</button><button data-theme="paper">P</button><button data-theme="black">N</button><button data-theme="white">B</button></div></header>
<div class="progress" id="progress"></div>
<div class="layout"><aside class="side"><h3>Capítulos</h3><nav class="chapters" id="chapters"></nav></aside><main><div class="book" id="book"><div class="loading">Cargando manuscrito e ilustraciones…</div></div><details class="atlas"><summary>Atlas visual</summary><div class="atlas-grid" id="atlas"></div></details></main></div>
<script>
const candidates=['00-prologo.md','01-el-primer-paso.md','02-bajo-la-niebla.md','03-la-ruta-que-respira.md','04-dos-tonos-en-la-niebla.md','05-la-ruta-que-sube.md','06-la-segunda-visita.md','07-la-parte-seca.md','08-el-agua-que-no-era-agua.md','09-antes-de-tocar-la-raiz.md','10-una-hora-mas.md','11-la-orbita-vacia.md','12-el-mismo-camino.md','13-la-mitad-de-una-racion.md','14-el-aire-que-gastas.md','15-lo-que-entra-contigo.md','16-la-mano-izquierda.md','17-el-tono-que-faltaba.md','18-lo-que-dejas-encendido.md','19-la-franja-que-vuelve.md','20-antes-de-la-llamada.md','21-antes-de-apoyar-el-pie.md','22-lo-que-entra.md','23-lo-que-dejas-fuera.md','24-lo-que-pesa.md','25-la-escala-que-faltaba.md'];
const roman=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX'];
let loaded=[],current=+(localStorage.getItem('elyndran-live-chapter')||0);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(s){const pages=s.split(/\r?\n\s*---\s*\r?\n/);const parse=part=>{let o=[],p=[];const f=()=>{if(p.length){o.push('<p>'+esc(p.join(' ')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')+'</p>');p=[]}};for(const l of part.split(/\r?\n/)){if(l.startsWith('# ')){f();o.push('<h1>'+esc(l.slice(2))+'</h1>')}else if(!l.trim()){f()}else p.push(l.trim())}f();return o.join('')};return pages.map((part,i)=>'<section class="story-page">'+parse(part)+(pages.length>1?'<div class="page-no">Página '+(i+1)+' de '+pages.length+'</div>':'')+'</section>').join('')}
function prefixFromTitle(title,pos){if(pos===0||/pr[oó]logo/i.test(title))return 'PROLOGO';const m=title.match(/Cap[ií]tulo\s+([IVXLCDM]+)/i);return m?m[1].toUpperCase():(roman[pos-1]||String(pos))}
function figure(id,label,opening=false){const f=document.createElement('figure');f.className='ill missing'+(opening?' opening':'');const img=document.createElement('img'),cap=document.createElement('figcaption');img.alt=label+' — ELYNDRAN';img.loading=opening?'eager':'lazy';img.decoding='async';cap.textContent=label;f.append(img,cap);const paths=['art/masters/'+id+'.webp','art/masters/'+id+'.png','art/masters/'+id+'.jpg','art/masters/'+id+'.svg'];let n=0;const next=()=>{if(n>=paths.length)return;img.src=paths[n++]+'?v=live-20260901'};img.onload=()=>{f.classList.remove('missing');buildAtlas()};img.onerror=next;next();return f}
function visuals(a,prefix){const h=a.querySelector('h1');if(!h)return;h.after(figure(prefix+'-A','Imagen de apertura',true));const ps=[...a.querySelectorAll('p')];if(!ps.length)return;const one=ps[Math.min(ps.length-1,Math.max(1,Math.round(ps.length*.38))-1)],two=ps[Math.min(ps.length-1,Math.max(2,Math.round(ps.length*.72))-1)];one?.after(figure(prefix+'-I1','Descubrimiento'));two?.after(figure(prefix+'-I2','Consecuencia'))}
function go(i){if(!loaded.length)return;current=Math.max(0,Math.min(loaded.length-1,i));localStorage.setItem('elyndran-live-chapter',current);document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',+a.dataset.i===current));document.querySelectorAll('#chapters a').forEach(a=>a.classList.toggle('active',+a.dataset.i===current));document.getElementById('progress').style.width=((current+1)/loaded.length*100)+'%';document.querySelector('#chapters a.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});scrollTo({top:58,behavior:'smooth'})}
function nav(i){const d=document.createElement('div');d.className='nav';const p=document.createElement('button'),n=document.createElement('button');p.textContent='← Anterior';n.textContent='Siguiente →';p.disabled=i===0;n.disabled=i===loaded.length-1;p.onclick=()=>go(i-1);n.onclick=()=>go(i+1);d.append(p,n);return d}
function buildAtlas(){const g=document.getElementById('atlas');if(!g)return;g.innerHTML='';document.querySelectorAll('.ill:not(.missing)').forEach(f=>{const img=f.querySelector('img');if(!img?.src)return;const c=document.createElement('figure');c.className='card';c.innerHTML='<img src="'+img.src+'" alt="'+img.alt+'"><figcaption>'+f.querySelector('figcaption').textContent+'</figcaption>';g.append(c)})}
async function load(){const book=document.getElementById('book'),tabs=document.getElementById('chapters');book.innerHTML='';tabs.innerHTML='';loaded=[];for(const file of candidates){try{const r=await fetch('manuscript/'+file+'?v=20260901',{cache:'no-store'});if(!r.ok)continue;const text=await r.text();if(!/^#\s+/m.test(text))continue;loaded.push({file,text})}catch(e){}}
if(!loaded.length){book.innerHTML='<div class="loading">No se ha podido cargar el manuscrito. Recarga la página.</div>';return}
loaded.forEach((item,i)=>{const a=document.createElement('article');a.className='article';a.dataset.i=i;a.innerHTML='<div class="kick">'+(i===0?'PRÓLOGO':'CAPÍTULO '+(roman[i-1]||i))+'</div>'+md(item.text);const title=a.querySelector('h1')?.textContent||item.file;const prefix=prefixFromTitle(title,i);visuals(a,prefix);a.append(nav(i));book.append(a);const l=document.createElement('a');l.href='#';l.dataset.i=i;l.textContent=(i===0?'PRÓLOGO':roman[i-1]||i)+' · '+title.replace(/^Capítulo\s+[IVXLCDM]+\s*[—-]\s*/i,'').replace(/^Prólogo\s*[—-]\s*/i,'');l.onclick=e=>{e.preventDefault();go(i)};tabs.append(l)});current=Math.min(current,loaded.length-1);go(current);buildAtlas()}
document.getElementById('smaller').onclick=()=>{const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read'))||1.08;document.documentElement.style.setProperty('--read',Math.max(.95,v-.05)+'rem')};document.getElementById('bigger').onclick=()=>{const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read'))||1.08;document.documentElement.style.setProperty('--read',Math.min(1.4,v+.05)+'rem')};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>document.body.className='theme-'+b.dataset.theme);load();
</script>
</body></html>
