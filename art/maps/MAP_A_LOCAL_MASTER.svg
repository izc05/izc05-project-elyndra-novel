<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">ELYNDRAN — Mapa A, sector local</title>
<desc id="desc">Cartografía diegética del sector local con conocimiento disponible al cierre del capítulo XII.</desc>
<defs><style>
